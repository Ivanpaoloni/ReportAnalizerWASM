<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MP Analyzer</title>
    <base href="/ReportAnalizerWASM/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <link href="css/app.css" rel="stylesheet" />
    <link href="ReportAnalizerWASM.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <style>
            /* Fondo por defecto (Modo Claro) */
            body {
                background-color: #F5F6F8;
                margin: 0;
            }

            /* Detecta si el sistema operativo está en Modo Oscuro */
            @media (prefers-color-scheme: dark) {
                body {
                    background-color: #121212;
                }
            }

            .splash-container {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 100vh;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            .mp-spinner {
                width: 60px;
                height: 60px;
                border: 6px solid rgba(0, 158, 227, 0.2); /* Celeste transparente */
                border-top-color: #009EE3; /* Celeste sólido de nuestra marca */
                border-radius: 50%;
                animation: spin 1s linear infinite;
                margin-bottom: 24px;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }

            .loading-text {
                color: #009EE3;
                font-size: 1.5rem;
                font-weight: bold;
                letter-spacing: 1px;
            }
        </style>

        <div class="splash-container">
            <div class="mp-spinner"></div>
            <div class="loading-text">MP Analyzer</div>
        </div>
    </div>
    <div id="blazor-error-ui">
        Ha ocurrido un error.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        window.descargarArchivo = (nombreArchivo, bytesBase64) => {
            const link = document.createElement('a');
            link.download = nombreArchivo;
            link.href = 'data:application/octet-stream;base64,' + bytesBase64;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>

</html>
